[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pad_train"
version = "1.1.0"
description = "k-NN presentation attack detection (PAD) for finger vein data, trained on real or synthetic attack samples."
readme = "README.md"
requires-python = ">=3.12"  # required by numpy 2.5
# Each author is listed twice on purpose. PyPI shows the "Author" metadata
# field (filled from the name-only entries) in full, but only the first entry
# of "Author-email" (filled from the entries with an email).
authors = [
  { name = "Andreas Auer" },
  { name = "Sarah Goetz" },
  { name = "Philipp Fuchs" },
  { name = "Andreas Auer", email = "andreas.auer03@gmail.com" },
  { name = "Sarah Goetz", email = "sarahgoetz0603@gmail.com" },
  { name = "Philipp Fuchs", email = "philipp.fuchs@stud.plus.ac.at" },
]
keywords = ["biometrics", "finger vein", "presentation attack detection", "k-NN", "synthetic data"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "mahotas>=1.4.19",
  "numpy>=2.5",
  "pandas>=3.0",
  "pillow>=12.3",
  "scikit-learn>=1.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.4",
  "pandas-stubs>=3.0",
  "pytest>=9.1",
  "ruff>=0.17",
]

[project.scripts]
pad-train = "pad_train.cli:main"

[project.urls]
Repository = "https://github.com/Kneidl18/PAD_train"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pad_train = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "D", "SIM", "PTH", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mahotas.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
