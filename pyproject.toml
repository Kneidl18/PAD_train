[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pad_train"
version = "1.0.1"
description = "k-NN presentation attack detection (PAD) for finger vein data, trained on real or synthetic attack samples."
readme = "README.md"
requires-python = ">=3.10"
# Every author needs an email: entries without one land in a different metadata
# field, and PyPI then shows only those names next to someone else's address.
authors = [
  { name = "Andreas Auer", email = "andreas.auer03@gmail.com" },
  { name = "Sarah Goetz", email = "sarahgoetz0603@gmail.com" },
  { name = "Philipp Fuchs", email = "philipp.fuchs@stud.plus.ac.at" },
]
keywords = ["biometrics", "finger vein", "presentation attack detection", "k-NN", "synthetic data"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "mahotas>=1.4.18",
  "numpy>=1.26",
  "pandas>=2.0",
  "pillow>=10.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pandas-stubs",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pad-train = "pad_train.cli:main"

[project.urls]
Repository = "https://github.com/Kneidl18/PAD_train"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pad_train = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "D", "SIM", "PTH", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mahotas.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
