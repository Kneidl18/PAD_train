# Builds the package, checks it and uploads it to PyPI.
#
# Triggered by publishing a GitHub release whose tag equals the version in
# pyproject.toml (e.g. "0.0.2"). Authentication uses PyPI trusted publishing
# (OIDC), so no token or password is stored in this repository.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and the tooling
        run: python -m pip install -e ".[dev]" build twine

      - name: Check that the release tag matches the package version
        run: |
          version="$(python -c 'from importlib.metadata import version; print(version("pad_train"))')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the package version '$version'."
            exit 1
          fi

      - name: Lint, type check and test
        run: |
          ruff format --check .
          ruff check .
          mypy
          pytest

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name of the trusted publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/pad-train/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
